<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=.8">
        <style>
            #mainDiv {
                border: solid black;
                width: 1256px;
                height: 1605px;
                box-shadow: inset 0 0 0 1000px rgba(255,255,255,.7);
            }
        </style>
        <!-- Load the yardMap JSON object -->
        <script type="text/javascript" src="data/yard.js"></script>
        <!-- Load the Product JSON -->
        <script type="text/javascript" src="data/prods.js"></script>
        <!-- Load the IMap class definition -->
        <script type="text/javascript" src="scripts/IMap.js"></script>
    </head>
    <body>
        <label for="stockClass">Stock class to view:</label>
        <select name="stockClass" id="stockClass" onchange="drawInventoryForClass(this);">
            <option value="None">&nbsp;</option>
        </select><br><br>
        <div id="mainDiv">
            <canvas id="mainCanvas" width="1256" height="1605"></canvas>
        </div>
        <script language="javascript">
            // Called from the stockClass.onchange event
            function drawInventoryForClass(control) {
                let c = document.getElementById("mainCanvas");
                let obj = new IMap(yardMap, c.getContext("2d"), c.width, c.height);
                obj.drawYard(true);
                let selTxt = control.options[control.selectedIndex].text;
                let origFont = obj.defaultFont;
                obj.defaultFont =  "48px Arial";
                obj.drawText("Stock Class " + selTxt, 900, 60, "black");
                obj.defaultFont =  "14px Arial";
                obj.drawText("Products updated: " + Products.Info.datetimemodified, 905, 85, "black");
                let ts = new Date().toLocaleDateString();
                obj.drawText("Current date: " + ts, 905, 105, "black");
                console.log();
                obj.defaultFont = origFont;

                obj.getDistinctLocsBadges(obj.Products[selTxt]);
                obj.badgeColor = control.value;
                for(let loc of obj.LocsBadges.keys()) {
                    obj.drawProdLocWithBadge(loc, obj.LocsBadges.get(loc));
                }
            }

            let c = document.getElementById("mainCanvas");
            let obj = new IMap(yardMap, c.getContext("2d"), c.width, c.height);
            obj.drawYard(false);

            // Create the stockClass drop down list using data in the Products JSON
            let filter = document.getElementById("stockClass");
            for (let sClass in Products) {
                if (Products.hasOwnProperty(sClass)) {
                    if(sClass != "Info") {
                        let option = document.createElement("option");
                        // Use the value property to store and set the badge and bundle color
                        switch(sClass){
                            case "A":
                                option.value = "ForestGreen";
                                break;
                            case "B":
                                option.value = "Navy";
                                break;
                            case "C":
                                option.value = "DarkOrange";
                                break;
                            case "D":
                                option.value = "SaddleBrown";
                                break;
                            case "U":
                                option.value = "FireBrick";
                                break;
                            default:
                                option.value = "OrangeRed";
                                break;
                        }
                        option.text = sClass;
                        filter.appendChild(option);
                    }
                }
            }
        </script>
    </body>
</html>
